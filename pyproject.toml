[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-fused-brain"
dynamic = ["version"]
description = "Merged pure-Python closed-loop engine and fractal brain architectures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.24", "scipy>=1.10"]
semantic = ["sentence-transformers>=3.0"]
faiss = ["faiss-cpu>=1.8.0"]
benchmarks = [
    "PyYAML>=6.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "psutil>=5.9",
    "optuna>=3.5",
    "ray[default]>=2.9",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "imbalanced-learn>=0.12",
    "py-spy>=0.3",
    "memory-profiler>=0.61",
]

[project.scripts]
metatune-benchmarks = "metatune.benchmarks.cli:main"

[tool.setuptools.dynamic]
version = {attr = "_version.__version__"}

[tool.setuptools]
py-modules = [
  "engine",
  "tokenizer",
  "memory",
  "moe_model",
  "planner",
  "quantization",
  "decomposer",
  "decoder",
  "demo",
  "ai_pipeline",
  "evaluation",
  "hybrid_engine",
  "hybrid_cli",
  "train_on_text",
  "how_to_use",
  "orchestrator",
  "persistence_demo",
  "demo_showcase",
  "run_tests",
  "run_xgboost_benchmark",
  "lkg",
  "adaptive_optimizer",
  "pipeline_optimizer",
  "_version",
  "language_model",
  "gemini_backend",
  "learning_evaluation",
  "fractal_router",
  "large_data",
  "synthetic_data",
  "ui_runtime",
  "app_streamlit_core",
]
packages = ["fractal_brain", "ocle_clean_build", "runtime_data", "metatune", "metatune.benchmarks"]
include-package-data = true

[tool.setuptools.package-data]
runtime_data = ["config.yaml", "config.semantic.yaml", "data/bootstrap_dataset.jsonl", "evaluation/v1.jsonl", "evaluation/learning_v1.jsonl"]
metatune = []
"metatune.benchmarks" = ["config.yaml", "README.md", "requirements.txt"]

